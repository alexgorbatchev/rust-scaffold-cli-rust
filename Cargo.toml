[package]
name = "rust-scaffold-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "Generate and inspect Rust CLI and library projects"
publish = false

[[bin]]
name = "rust-scaffold"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["string"] }
clap_complete = "4.6"
cli-command-kit = { path = "../cli-command-kit" }
rust-project-scaffold = { path = "crates/rust-project-scaffold" }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }

[dev-dependencies]
tempfile = "3"

[workspace]
members = [".","crates/rust-project-scaffold"]
default-members = [".","crates/rust-project-scaffold"]
resolver = "3"
