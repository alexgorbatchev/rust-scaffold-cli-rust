[package]
name = "rust-project-scaffold"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "Generate and inspect Rust CLI and library projects"

[dependencies]
cap-std = "4.0.3"
cap-fs-ext = "4.0.3"
chrono = "0.4"
minijinja = "3.0.0"
toml = "1.1"
syn = { version = "2", features = ["full", "visit"] }
semver = "1"
url = "2"
include_dir = "0.7.4"
libc = "0.2"
thiserror = "2"
tokio = { version = "1", features = ["process", "rt-multi-thread", "macros", "time", "io-util"] }
tokio-util = "0.7"
whoami = "2.1.3"
walkdir = "2"
uuid = { version = "1.28.0", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
xattr = "1.6.1"

[dev-dependencies]
tempfile = "3"

